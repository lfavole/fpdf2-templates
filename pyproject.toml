[project]
name = "fpdf2-templates"
version = "0.1.0"
description = "Utility scripts to generate PDF documents in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["click", "fpdf2", "requests", "typer", "werkzeug"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint.main]
jobs = 0
disable = [
    "bad-indentation",
    "bare-except",
    "fixme",
    "global-statement",
    "import-outside-toplevel",
    "invalid-str-returned",
    "line-too-long",
    "missing-module-docstring",
    "missing-timeout",
    "no-member",
    "protected-access",
    "unspecified-encoding",
]
include-naming-hint = "y"

[tool.pylint.basic]
allowed-redefined-builtins = "id"
good-names = ["f", "i", "id"]
no-docstring-rgx = "^(main|__.*__)$"
